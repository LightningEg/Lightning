{% if app_theme is defined %}<meta name="lightning-theme" content="{{ app_theme }}"><meta name="lightning-owned" content="{{ owned_themes|default('') }}"><meta name="lightning-follow-night" content="{{ '1' if follow_night|default(false) else '0' }}">{% endif %}
