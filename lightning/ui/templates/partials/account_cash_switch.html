{% if account.active and kind in ('CASH','BANK','BROKERAGE') %}<form method="post" action="/accounts/{{ account.id }}/spendable"><input type="hidden" name="spendable" value="{{ 'no' if account_spendable else 'yes' }}"><button>{{ ('Keep its cash apart from spendable' if account_spendable else 'Count its cash as spendable')|tr(locale) }}</button><input type="hidden" name="__session" value="{{ request.state.session_token|default('') }}"></form>{% endif %}
