{# NF-12AJ: a move covers this month only or changes the usual plan; the default follows the reason (route). #}
<div class="plan-past-due" role="radiogroup" aria-label="{{ 'How long the move lasts'|tr(locale) }}">
  <label><input type="radio" name="scope" value="month"{% if scope == 'month' %} checked{% endif %}><span><b>{{ 'Cover this month'|tr(locale) }}</b> <small class="muted">{% if to_next is none or from_next is none %}{{ '{month} only'|tr(locale, values={'month': month|month(locale)}) }}{% else %}{{ '{month} only · {next} stays {to} {a} · {from} {b}'|tr(locale, values={'month': month|month(locale), 'next': next_month|month(locale), 'to': to.name, 'a': to_next|money(False, 0), 'from': source.name, 'b': from_next|money(False, 0)}) }}{% endif %}</small></span></label>
  <label><input type="radio" name="scope" value="usual"{% if scope == 'usual' %} checked{% endif %}><span><b>{{ 'Change my usual plan'|tr(locale) }}</b> <small class="muted">{{ 'Every month from {month} · {to} {a} · {from} {b}'|tr(locale, values={'month': month|month(locale), 'to': to.name, 'a': (to_plan + amount)|money(False, 0), 'from': source.name, 'b': (from_plan - amount)|money(False, 0)}) }}</small></span></label>
</div>
