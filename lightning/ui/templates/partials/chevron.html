{# One forward chevron for the phone (IV-3BG1). The Arabic stylesheet flips this exact path, so it points forward in both languages. #}
{% macro chevron(back=False) -%}
<svg class="chevron{{ ' chevron-back' if back }}" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
{%- endmacro %}
