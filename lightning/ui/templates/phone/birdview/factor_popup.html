{# The sale share used in planning, on the phone (3AY17). Saves as it changes. #}
<section class="app-popup-content phone-txn-sheet"><h2 class="phone-sheet-title" id="app-popup-title">{{ "Liquidation scenario"|tr(locale) }}</h2><p class="phone-note">{{ "Choose the share of investment holdings to include in this planning estimate. Cash and deposits stay at full value."|tr(locale) }}</p>
<form method="post" action="/birdview/settings" class="phone-form" data-popup-autosave><label>{{ 'Investment value included (%)'|tr(locale) }}<input type="number" name="factor" min="0" max="100" step="0.1" value="{{ factor }}" required inputmode="decimal"></label><span class="inline-save-status" role="status" aria-live="polite"></span><button type="button" class="btn phone-save" data-popup-close>{{ "Close"|tr(locale) }}</button><input type="hidden" name="__session" value="{{ request.state.session_token|default('') }}"></form></section>
