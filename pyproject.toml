[project]
name = "lightning"
version = "1.5.4"
description = "Personal finance: accounts, cash flow, investments and net worth in one place."
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.162.0", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "pytest-xdist>=3.8", "httpx>=0.27", "httpx2>=2.16.0", "import-linter>=2.1"]
encrypted = ["sqlcipher3==0.6.4", "cryptography==50.0.2", "tzdata==2026.6"]
desktop = ["pywebview==6.2.1; sys_platform == 'win32'", "pythonnet==3.2.1; sys_platform == 'win32'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# Checked by `ruff check lightning tools` in .github/workflows/pr-checks.yml (version pinned in requirements/lint.lock).
# Unused imports, names defined twice and unused variables only: each was a real slip (IT-1J).
[tool.ruff.lint]
select = ["F401", "F811", "F841"]

# ---------------------------------------------------------------------------
# Architecture rules, checked by `lint-imports` (and by tests/test_architecture.py)
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "lightning"

[[tool.importlinter.contracts]]
name = "Layers: each layer may only import the layers below it"
type = "layers"
layers = [
    "lightning.desktop | lightning.main",
    "lightning.runtime",
    "lightning.ui",
    "lightning.bootstrap",
    "lightning.sync",
    "lightning.workflows | lightning.bank_imports | lightning.sms_imports | lightning.reconciliation | lightning.integrity | lightning.ownership_migration | lightning.saved_views | lightning.demo | lightning.samples | lightning.zakat",
    "lightning.bank_import_proposals | lightning.bank_import_posting",
    "lightning.bank_import_parsing",
    "lightning.planning",
    "lightning.budgeting",
    "lightning.investments | lightning.deposits | lightning.rules | lightning.reevaluations | lightning.physical_items | lightning.reserves | lightning.reimbursements",
    "lightning.reporting",
    "lightning.transactions | lightning.money_from_others",
    "lightning.accounts | lightning.counterparties",
    "lightning.assets | lightning.categories | lightning.fx",
    "lightning.database | lightning.security | lightning.market",
    "lightning.undo",
    "lightning.core",
]

[[tool.importlinter.contracts]]
name = "The UI never touches SQL or repositories directly"
type = "forbidden"
source_modules = ["lightning.ui"]
forbidden_modules = [
    "lightning.database",
    "lightning.accounts.repository",
    "lightning.assets.repository",
    "lightning.categories.repository",
    "lightning.transactions.repository",
    "lightning.budgeting.repository",
    "lightning.reporting.queries",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Modules use each other's services, never each other's repositories"
type = "forbidden"
source_modules = [
    "lightning.transactions",
    "lightning.reporting",
    "lightning.workflows",
    "lightning.budgeting",
    "lightning.investments",
    "lightning.deposits",
    "lightning.planning",
]
forbidden_modules = [
    "lightning.accounts.repository",
    "lightning.assets.repository",
    "lightning.categories.repository",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Workflows and reporting never write through the transactions repository"
type = "forbidden"
source_modules = ["lightning.workflows", "lightning.reporting", "lightning.budgeting", "lightning.investments", "lightning.deposits", "lightning.planning"]
forbidden_modules = ["lightning.transactions.repository"]
allow_indirect_imports = true
# Each sync module, including package initializers, has an explicit policy.
[tool.lightning-sync-policy]
protocol = [
    "lightning.sync.domain",
    "lightning.sync.journal.areas.spec",
    "lightning.sync.journal.codec",
    "lightning.sync.journal.errors",
    "lightning.sync.journal.request_limits",
]
financial_adapters = [
    "lightning.sync.journal.areas.automation",
    "lightning.sync.journal.areas.cash",
    "lightning.sync.journal.areas.currency",
    "lightning.sync.journal.areas.deposits",
    "lightning.sync.journal.areas.history",
    "lightning.sync.journal.areas.household",
    "lightning.sync.journal.areas.imports",
    "lightning.sync.journal.areas.investments",
    "lightning.sync.journal.areas.master",
    "lightning.sync.journal.areas.people",
    "lightning.sync.journal.areas.physical",
    "lightning.sync.journal.areas.plans",
    "lightning.sync.journal.areas.rules",
    "lightning.sync.journal.areas.settings",
    "lightning.sync.journal.areas.sms",
    "lightning.sync.journal.areas.workflows",
    "lightning.sync.journal.automation",
    "lightning.sync.journal.capture",
    "lightning.sync.journal.commands",
    "lightning.sync.journal.effects",
    "lightning.sync.journal.finance",
    "lightning.sync.journal.history",
    "lightning.sync.journal.proxy",
]
runtime_boundary = [
    "lightning.sync",
    "lightning.sync.journal",
    "lightning.sync.journal.areas",
    "lightning.sync.control",
    "lightning.sync.copies",
    "lightning.sync.identity",
    "lightning.sync.journal.__main__",
    "lightning.sync.journal.authority",
    "lightning.sync.journal.backups",
    "lightning.sync.journal.cloud",
    "lightning.sync.journal.compatibility",
    "lightning.sync.journal.cutover",
    "lightning.sync.journal.device",
    "lightning.sync.journal.discovery",
    "lightning.sync.journal.enrollment",
    "lightning.sync.journal.home",
    "lightning.sync.journal.local",
    "lightning.sync.journal.membership",
    "lightning.sync.journal.owner",
    "lightning.sync.journal.pairing",
    "lightning.sync.journal.pairing_client",
    "lightning.sync.journal.snapshots",
    "lightning.sync.journal.store",
    "lightning.sync.journal.upgrades",
    "lightning.sync.service",
    "lightning.sync.state",
    "lightning.sync.transport",
]
