[project]
name = "lightning"
version = "1.4.3"
description = "Personal finance: accounts, cash flow, investments and net worth in one place."
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.8", "httpx>=0.27", "httpx2>=2.13.1", "import-linter>=2.1"]
encrypted = ["sqlcipher3==0.6.2", "cryptography==50.0.2", "tzdata==2026.2"]
desktop = ["pywebview==6.2.1; sys_platform == 'win32'", "pythonnet==3.1.0; sys_platform == 'win32'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ---------------------------------------------------------------------------
# Architecture rules, checked by `lint-imports` (and by tests/test_architecture.py)
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "lightning"

[[tool.importlinter.contracts]]
name = "Layers: each layer may only import the layers below it"
type = "layers"
layers = [
    "lightning.desktop | lightning.main",
    "lightning.runtime",
    "lightning.ui",
    "lightning.bootstrap",
    "lightning.workflows",
    "lightning.planning",
    "lightning.budgeting",
    "lightning.investments | lightning.deposits | lightning.rules",
    "lightning.reporting",
    "lightning.transactions",
    "lightning.accounts",
    "lightning.assets | lightning.categories",
    "lightning.database | lightning.security | lightning.market",
    "lightning.core",
]

[[tool.importlinter.contracts]]
name = "The UI never touches SQL or repositories directly"
type = "forbidden"
source_modules = ["lightning.ui"]
forbidden_modules = [
    "lightning.database",
    "lightning.accounts.repository",
    "lightning.assets.repository",
    "lightning.categories.repository",
    "lightning.transactions.repository",
    "lightning.budgeting.repository",
    "lightning.reporting.queries",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Modules use each other's services, never each other's repositories"
type = "forbidden"
source_modules = [
    "lightning.transactions",
    "lightning.reporting",
    "lightning.workflows",
    "lightning.budgeting",
    "lightning.investments",
    "lightning.deposits",
    "lightning.planning",
]
forbidden_modules = [
    "lightning.accounts.repository",
    "lightning.assets.repository",
    "lightning.categories.repository",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Workflows and reporting never write through the transactions repository"
type = "forbidden"
source_modules = ["lightning.workflows", "lightning.reporting", "lightning.budgeting", "lightning.investments", "lightning.deposits", "lightning.planning"]
forbidden_modules = ["lightning.transactions.repository"]
allow_indirect_imports = true
