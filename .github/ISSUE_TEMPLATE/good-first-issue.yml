name: Good first issue
description: A small, self-contained task someone new can finish in an evening (maintainers and AIs write these)
labels: ["good first issue"]
body:
  - type: markdown
    attributes:
      value: |
        These prompts help us investigate. Fill in what you know and skip the rest.
        Prefer your own format? Use a blank issue from the issue chooser.
        Use dummy examples only. Do not share financial records, account numbers, passwords, recovery keys or backups.
        Report security problems privately: https://github.com/LightningEg/Lightning/security/advisories/new
  - type: input
    id: code
    attributes: {label: Code, description: "The item's code in issues/ (e.g. 3C); also put it at the start of the title: [3C] …"}
  - type: textarea
    id: what
    attributes: {label: What's wrong, description: "One or two sentences. Dummy data only (Mohab's demo)."}
  - type: textarea
    id: done
    attributes: {label: Done when, description: "What you see in the demo, or the test that passes, once it's fixed."}
  - type: input
    id: files
    attributes: {label: Where to look, description: "The file (and function) most likely to change."}
  - type: textarea
    id: read
    attributes: {label: Read first (optional), description: "At most two links, e.g. a section of docs/ARCHITECTURE.md."}
  - type: markdown
    attributes: {value: "To work on it: comment `/take`. Setup and the rest: [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md)."}
