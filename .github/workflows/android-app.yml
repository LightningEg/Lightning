# The phone app, Lightning Test: built only from requirements/android.lock and checked in one job, then
# signed with the test key and checked again in another, so the key never meets Gradle. Run it by hand to
# check a change cheaply (Linux, about 3 minutes); without the bundle input it uploads only a one-day
# artifact for its own sign job. "PC and phone app" (desktop-probe.yml) calls it for the matched test
# builds, which need the test key, and in the daily run when the phone's files changed.
# How it fits: docs/ARCHITECTURE.md › Build and release.
name: Phone app

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      bundle:
        description: Called for the matched test builds, so the APK must carry the test key
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apk:
    # No secret reaches this job: Gradle and what it downloads never run beside the test key.
    name: Build and check the phone app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version_code: ${{ steps.identity.outputs.version_code }}
      version_name: ${{ steps.identity.outputs.version_name }}
      apk: ${{ steps.identity.outputs.apk }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0  # the version code is the number of commits
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c  # v5
        with:
          gradle-version: '8.11.1'
      - name: Test identity (version code = commits on main)
        id: identity
        run: python packaging/phone_build.py identity
      - name: Build the arm64 app from the lock (no index; every file pinned by hash)
        working-directory: android
        env:
          CODE: ${{ steps.identity.outputs.version_code }}
          NAME: ${{ steps.identity.outputs.version_name }}
        run: gradle --no-daemon :app:assembleDebug "-PtestVersionCode=$CODE" "-PtestVersionName=$NAME"
      - name: Check the app as built (ID, version, arm64, permissions, files, packages)
        env:
          CODE: ${{ steps.identity.outputs.version_code }}
          NAME: ${{ steps.identity.outputs.version_name }}
        run: >-
          python packaging/phone_build.py check android/app/build/outputs/apk/debug/app-debug.apk
          --build-tools "$ANDROID_HOME/build-tools/35.0.0" --code "$CODE" --name "$NAME" --info "$RUNNER_TEMP/built.json"
      - name: The key script's keys sign APKs (a throwaway key; its APK never leaves this job)
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          python -m pip install --quiet 'cryptography==50.0.2'
          python tools/android_test_key.py "$RUNNER_TEMP/throwaway" > /dev/null
          base64 -d "$RUNNER_TEMP/throwaway/ANDROID_TEST_KEYSTORE.txt" > "$RUNNER_TEMP/throwaway.p12"
          export PASS="$(cat "$RUNNER_TEMP/throwaway/ANDROID_TEST_KEYSTORE_PASSWORD.txt")"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/throwaway.p12" --ks-type PKCS12 --ks-pass env:PASS --key-pass env:PASS \
            --ks-key-alias lightning-test --out "$RUNNER_TEMP/throwaway.apk" android/app/build/outputs/apk/debug/app-debug.apk
          signer="$(python packaging/phone_build.py signer "$RUNNER_TEMP/throwaway.apk" --build-tools "$tools")"
          expected="$(cat "$RUNNER_TEMP/throwaway/certificate-sha256.txt")"
          [ "$signer" = "$expected" ] || { echo "::error::signed by $signer, not the script's certificate $expected"; exit 1; }
          rm -rf "$RUNNER_TEMP/throwaway" "$RUNNER_TEMP/throwaway.p12" "$RUNNER_TEMP/throwaway.apk"
          echo "A key from tools/android_test_key.py signs and verifies with apksigner."
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: phone-unsigned  # to the sign job only; one day
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  sign:
    # Only here does the test key exist, beside nothing but the SDK's apksigner and this repository's checks.
    name: Sign and check the phone app
    environment: android-signing
    # Defense in depth: only sign from main or owner-controlled release tags.
    # Repository secrets remain accessible to other workflows until moved out.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4
        with:
          packages: platform-tools
      - run: sdkmanager 'build-tools;35.0.0'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: phone-unsigned
          path: ${{ runner.temp }}/unsigned
      - name: Sign with the test key
        id: sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUNDLE: ${{ inputs.bundle }}
          APK: ${{ needs.apk.outputs.apk }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            if [ "$BUNDLE" = "true" ]; then
              echo "::error::The Android signing key needs ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
              exit 1
            fi
            echo "::notice::No test key yet: this APK is checked but not signed with it, and nothing is uploaded."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          # Base64 can contain line breaks; preserve passwords byte for byte.
          if ! printf '%s' "$KEYSTORE" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/signing.keystore" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi
          if ! "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/signing.keystore" \
              --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --ks-key-alias "$KEY_ALIAS" \
              --out "$RUNNER_TEMP/$APK" "$RUNNER_TEMP/unsigned/app-debug.apk"; then
            rm -f "$RUNNER_TEMP/signing.keystore"
            echo "::error::The Android signing keystore, alias or password was rejected by apksigner."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/signing.keystore"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Pin the public signing certificate
        if: steps.sign.outputs.signed == 'true'
        env:
          APK: ${{ needs.apk.outputs.apk }}
        run: |
          set -euo pipefail
          fingerprint="$(python packaging/phone_build.py signer "$RUNNER_TEMP/$APK" --build-tools "$ANDROID_HOME/build-tools/35.0.0")"
          if ! [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Expected exactly one SHA-256 signing fingerprint."
            exit 1
          fi
          echo "Public Android signing certificate SHA-256: $fingerprint"
          if [ ! -f packaging/android-test-certificate.sha256 ]; then
            echo "::error::Pin this public fingerprint in packaging/android-test-certificate.sha256 before publishing."
            exit 1
          fi
      - name: Check the signed app (the same checks, and the test certificate alone)
        if: steps.sign.outputs.signed == 'true'
        env:
          CODE: ${{ needs.apk.outputs.version_code }}
          NAME: ${{ needs.apk.outputs.version_name }}
          APK: ${{ needs.apk.outputs.apk }}
        run: >-
          python packaging/phone_build.py check "$RUNNER_TEMP/$APK"
          --build-tools "$ANDROID_HOME/build-tools/35.0.0" --code "$CODE" --name "$NAME"
          --certificate packaging/android-test-certificate.sha256 --info "$RUNNER_TEMP/apk.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        if: inputs.bundle && steps.sign.outputs.signed == 'true'
        with:
          name: phone-apk
          path: |
            ${{ runner.temp }}/${{ needs.apk.outputs.apk }}
            ${{ runner.temp }}/apk.json
          if-no-files-found: error
          overwrite: true  # a re-run of the job replaces its own upload
          retention-days: 1  # the bundle job copies it into the seven-day downloads
