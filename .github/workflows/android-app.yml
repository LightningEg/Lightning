# The phone app, Lightning: built only from requirements/android.lock and checked in one job, then
# signed with the signing key and checked again in another, so the key never meets Gradle. Run it by hand to
# check a change cheaply (Linux, about 3 minutes); without the bundle input it uploads only a one-day
# artifact for its own sign job. "PC and phone app" (desktop-probe.yml) calls it for the matched
# builds, which need the signing key, and in the daily run when the phone's files changed.
# How it fits: ai/ARCHITECTURE.md › Build and release.
name: Phone app

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      bundle:
        description: Called for the matched builds, so the APK must carry the signing key
        type: boolean
        default: false
    # GitHub requires caller mappings even when values exist only in the signing environment. They are not
    # `required`: a caller that holds none in its repository would otherwise fail at startup (no jobs, 0 s), and the
    # signing job below fails by itself, with its own message, when the environment lacks the key.
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      ANDROID_UPLOAD_KEYSTORE_BASE64:
        required: false
      ANDROID_UPLOAD_KEYSTORE_PASSWORD:
        required: false
      ANDROID_UPLOAD_KEY_ALIAS:
        required: false
      ANDROID_UPLOAD_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  apk:
    # No secret reaches this job: Gradle and what it downloads never run beside the signing key.
    name: Build and check the phone app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version_code: ${{ steps.identity.outputs.version_code }}
      version_name: ${{ steps.identity.outputs.version_name }}
      apk: ${{ steps.identity.outputs.apk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the version code is the number of commits
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c  # the pin the LightningEg action policy allows (1H)
        with:
          gradle-version: '8.11.1'
      - name: Build identity (version code = commits on main)
        id: identity
        run: python packaging/phone_build.py identity
      - name: Build the arm64 release APK and Play bundle from the lock (no index; every file pinned by hash)
        working-directory: android
        env:
          CODE: ${{ steps.identity.outputs.version_code }}
          NAME: ${{ steps.identity.outputs.version_name }}
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease "-PbuildVersionCode=$CODE" "-PbuildVersionName=$NAME"
      - name: Check the app as built (ID, version, arm64, permissions, files, packages)
        env:
          CODE: ${{ steps.identity.outputs.version_code }}
          NAME: ${{ steps.identity.outputs.version_name }}
        run: >-
          python packaging/phone_build.py check android/app/build/outputs/apk/release/app-release-unsigned.apk
          --build-tools "$ANDROID_HOME/build-tools/36.0.0" --code "$CODE" --name "$NAME" --info "$RUNNER_TEMP/built.json"
      - name: Check the Play bundle (bundletool validate; ID, version, target SDK, not debuggable)
        env:
          CODE: ${{ steps.identity.outputs.version_code }}
          NAME: ${{ steps.identity.outputs.version_name }}
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          echo "675786493983787ffa11550bdb7c0715679a44e1643f3ff980a529e9c822595c  $RUNNER_TEMP/bundletool.jar" | sha256sum --check --strict
          python packaging/phone_build.py aab android/app/build/outputs/bundle/release/app-release.aab \
            --bundletool "$RUNNER_TEMP/bundletool.jar" --code "$CODE" --name "$NAME"
      - name: The key script's keys sign APKs (a throwaway key; its APK never leaves this job)
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          python -m pip install --quiet 'cryptography==50.0.2'
          python tools/android_test_key.py "$RUNNER_TEMP/throwaway" > /dev/null
          base64 -d "$RUNNER_TEMP/throwaway/ANDROID_TEST_KEYSTORE.txt" > "$RUNNER_TEMP/throwaway.p12"
          export PASS="$(cat "$RUNNER_TEMP/throwaway/ANDROID_TEST_KEYSTORE_PASSWORD.txt")"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/throwaway.p12" --ks-type PKCS12 --ks-pass env:PASS --key-pass env:PASS \
            --ks-key-alias lightning-test --out "$RUNNER_TEMP/throwaway.apk" android/app/build/outputs/apk/release/app-release-unsigned.apk
          signer="$(python packaging/phone_build.py signer "$RUNNER_TEMP/throwaway.apk" --build-tools "$tools")"
          expected="$(cat "$RUNNER_TEMP/throwaway/certificate-sha256.txt")"
          [ "$signer" = "$expected" ] || { echo "::error::signed by $signer, not the script's certificate $expected"; exit 1; }
          rm -rf "$RUNNER_TEMP/throwaway" "$RUNNER_TEMP/throwaway.p12" "$RUNNER_TEMP/throwaway.apk"
          echo "A key from tools/android_test_key.py signs and verifies with apksigner."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: phone-unsigned  # to the sign job only; one day
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: play-bundle-unsigned  # to the sign job, and the evidence that Play's bundle builds (NF-11B1)
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  sign:
    # Only here does the signing key exist, beside nothing but the SDK's apksigner and this repository's checks.
    name: Sign and check the phone app
    environment: android-signing
    # Defense in depth: only sign from main or owner-controlled release tags.
    # Values exist only in this environment; the caller declares the four names for resolution.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4
        with:
          packages: platform-tools
      - run: sdkmanager 'build-tools;36.0.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: phone-unsigned
          path: ${{ runner.temp }}/unsigned
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: play-bundle-unsigned
          path: ${{ runner.temp }}/bundle
      - name: Sign the Play bundle with the upload key (Play App Signing keeps the app key)
        id: upload
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          APK: ${{ needs.apk.outputs.apk }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::notice::No upload key yet (ANDROID_UPLOAD_*): the Play bundle is checked but not signed or uploaded."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          if ! printf '%s' "$KEYSTORE" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/upload.keystore" 2>/dev/null; then
            echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi
          AAB="${APK%.apk}.aab"
          cp "$RUNNER_TEMP/bundle/app-release.aab" "$RUNNER_TEMP/$AAB"
          if ! jarsigner -keystore "$RUNNER_TEMP/upload.keystore" -storepass:env STORE_PASS -keypass:env KEY_PASS \
              -sigalg SHA256withRSA -digestalg SHA-256 "$RUNNER_TEMP/$AAB" "$KEY_ALIAS" > /dev/null; then
            rm -f "$RUNNER_TEMP/upload.keystore"
            echo "::error::The upload keystore, alias or password was rejected by jarsigner."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/upload.keystore"
          jarsigner -verify "$RUNNER_TEMP/$AAB" | grep -q "jar verified" || { echo "::error::The signed bundle does not verify."; exit 1; }
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: steps.upload.outputs.signed == 'true'
        with:
          name: play-bundle  # for the owner to upload to the Play Console (NF-11B7)
          path: ${{ runner.temp }}/${{ steps.upload.outputs.aab }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Sign with the signing key
        id: sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUNDLE: ${{ inputs.bundle }}
          APK: ${{ needs.apk.outputs.apk }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            if [ "$BUNDLE" = "true" ]; then
              echo "::error::The Android signing key needs ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
              exit 1
            fi
            echo "::notice::No signing key yet: this APK is checked but not signed with it, and nothing is uploaded."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          # Base64 can contain line breaks; preserve passwords byte for byte.
          if ! printf '%s' "$KEYSTORE" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/signing.keystore" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi
          if ! "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/signing.keystore" \
              --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --ks-key-alias "$KEY_ALIAS" \
              --out "$RUNNER_TEMP/$APK" "$RUNNER_TEMP/unsigned/app-release-unsigned.apk"; then
            rm -f "$RUNNER_TEMP/signing.keystore"
            echo "::error::The Android signing keystore, alias or password was rejected by apksigner."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/signing.keystore"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Pin the public signing certificate
        if: steps.sign.outputs.signed == 'true'
        env:
          APK: ${{ needs.apk.outputs.apk }}
        run: |
          set -euo pipefail
          fingerprint="$(python packaging/phone_build.py signer "$RUNNER_TEMP/$APK" --build-tools "$ANDROID_HOME/build-tools/36.0.0")"
          if ! [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Expected exactly one SHA-256 signing fingerprint."
            exit 1
          fi
          echo "Public Android signing certificate SHA-256: $fingerprint"
          if [ ! -f packaging/android-test-certificate.sha256 ]; then
            echo "::error::Pin this public fingerprint in packaging/android-test-certificate.sha256 before publishing."
            exit 1
          fi
      - name: Check the signed app (the same checks, and the signing certificate alone)
        if: steps.sign.outputs.signed == 'true'
        env:
          CODE: ${{ needs.apk.outputs.version_code }}
          NAME: ${{ needs.apk.outputs.version_name }}
          APK: ${{ needs.apk.outputs.apk }}
        run: >-
          python packaging/phone_build.py check "$RUNNER_TEMP/$APK"
          --build-tools "$ANDROID_HOME/build-tools/36.0.0" --code "$CODE" --name "$NAME"
          --certificate packaging/android-test-certificate.sha256 --info "$RUNNER_TEMP/apk.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: inputs.bundle && steps.sign.outputs.signed == 'true'
        with:
          name: phone-apk
          path: |
            ${{ runner.temp }}/${{ needs.apk.outputs.apk }}
            ${{ runner.temp }}/apk.json
          if-no-files-found: error
          overwrite: true  # a re-run of the job replaces its own upload
          retention-days: 1  # the bundle job copies it into the seven-day downloads
