name: Import bank logos once
on:
  push:
    paths:
      - ".github/workflows/import-bank-logos-once.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=10,<13" "requests>=2.31,<3"
      - run: python tools/import_egypt_bank_logos.py
      - name: Commit real files into assets/bank-logos
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bank-logos
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets: add actual Egyptian bank logo images"
          git push origin "HEAD:$(git branch --show-current)"
