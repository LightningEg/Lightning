# Lets anyone claim an issue in one comment, and frees claims nobody is working on (CONTRIBUTING.md).
#   /take  assigns the issue to you and labels it "taken"     /drop  gives it back
# Runs on comments and on a schedule, never on pull request code. Comment text reaches the shell only through
# environment variables, never through ${{ }} inside a script.
# Tasks with Lightning Coins: assignments made here use GITHUB_TOKEN, and events caused by GITHUB_TOKEN do not start
# other workflows, so this file also records and releases the claim itself (rewards.yml sees manual assignments).
# Without the SUPABASE_SERVICE_ROLE_KEY secret (forks, before setup) the claim steps print a notice and do nothing.
name: Contributors

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '17 6 * * *'

permissions:
  issues: write

jobs:
  claim:
    if: >-
      github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      (startsWith(github.event.comment.body, '/take') || startsWith(github.event.comment.body, '/drop'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.issue.number }}
      WHO: ${{ github.event.comment.user.login }}
      ROLE: ${{ github.event.comment.author_association }}
      BODY: ${{ github.event.comment.body }}
      STATE: ${{ github.event.issue.state }}
      ASSIGNEES: ${{ join(github.event.issue.assignees.*.login, ' ') }}
      WHO_ID: ${{ github.event.comment.user.id }}
      SUPABASE_URL: https://etecxblerynmkgppdfac.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - run: |
          set -euo pipefail
          # rpc <function> <json>: POST to Supabase with the service key. No key (a fork, or before setup): skip.
          rpc() {
            if [[ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then echo "::notice::SUPABASE_SERVICE_ROLE_KEY is not set, so $1 is skipped."; return 0; fi
            local out code
            out=$(mktemp)
            code=$({
              printf 'header = "apikey: %s"\n' "$SUPABASE_SERVICE_ROLE_KEY"
              [[ "$SUPABASE_SERVICE_ROLE_KEY" == sb_secret_* ]] || printf 'header = "Authorization: Bearer %s"\n' "$SUPABASE_SERVICE_ROLE_KEY"
            } | curl -sS --config - --max-time 30 --retry 2 -o "$out" -w '%{http_code}' -X POST \
                  -H 'Content-Type: application/json' --data "$2" "$SUPABASE_URL/rest/v1/rpc/$1") || { echo "::error::could not reach Supabase ($1)"; return 1; }
            cat "$out"; echo
            [[ "$code" == 2* ]] || { echo "::error::Supabase $1 answered HTTP $code"; return 1; }
          }
          claim_call() {  # claim_call record_claim|release_claim <issue number> <github id> <login>
            [[ "$2" =~ ^[0-9]+$ && "$3" =~ ^[0-9]+$ ]] || { echo "::error::unexpected issue or user id"; return 1; }
            if [[ "$1" == record_claim ]]; then
              rpc record_claim "$(jq -nc --arg repo "$GH_REPO" --argjson issue "$2" --argjson id "$3" --arg login "$4" \
                '{p_repo:$repo, p_issue:$issue, p_github_id:$id, p_github_login:$login}')"
            else
              rpc release_claim "$(jq -nc --arg repo "$GH_REPO" --argjson issue "$2" --argjson id "$3" \
                '{p_repo:$repo, p_issue:$issue, p_github_id:$id}')"
            fi
          }
          gh label create taken --color FBCA04 --description "Someone is working on it (/take)" 2>/dev/null || true
          say() { gh issue comment "$NUMBER" --body "$1"; }
          status=0  # a failed coin record fails the job, but never stops the person hearing back
          if [[ "$BODY" == /drop* ]]; then
            if [[ " $ASSIGNEES " == *" $WHO "* ]]; then
              gh issue edit "$NUMBER" --remove-assignee "$WHO" --remove-label taken
              claim_call release_claim "$NUMBER" "$WHO_ID" "$WHO" || status=1
              say "Thanks @$WHO, this is free again for anyone to \`/take\`."
            fi
            exit "$status"
          fi
          if [[ "$STATE" != open ]]; then say "@$WHO this issue is closed. Pick an open one: label \`good first issue\`."; exit 0; fi
          if [[ -n "$ASSIGNEES" ]]; then
            [[ " $ASSIGNEES " == *" $WHO "* ]] || say "@$WHO this one is already taken by @${ASSIGNEES// /, @}. Have a look at the other \`good first issue\`s."
            exit 0
          fi
          if [[ "$ROLE" != OWNER && "$ROLE" != MEMBER && "$ROLE" != COLLABORATOR ]]; then
            open=$(gh issue list --assignee "$WHO" --label taken --state open --json number --jq '.[0].number // empty')
            if [[ -n "$open" ]]; then say "@$WHO you already have #$open. Finish it or \`/drop\` it, then take this one."; exit 0; fi
          fi
          gh issue edit "$NUMBER" --add-assignee "$WHO" --add-label taken
          claim_call record_claim "$NUMBER" "$WHO_ID" "$WHO" || status=1
          say "It's yours, @$WHO. Next:
          1. Open it in Codespaces (nothing to install): https://codespaces.new/$GH_REPO?quickstart=1, or locally: \`pip install -r requirements-dev.txt && python -m lightning --demo\`
          2. Make the change and send a pull request with \`Closes #$NUMBER\` in it.
          Stuck? Ask here. No activity for 14 days frees the issue; \`/drop\` gives it back any time."
          exit "$status"

  stale:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SUPABASE_URL: https://etecxblerynmkgppdfac.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - run: |
          set -euo pipefail
          # rpc <function> <json>: POST to Supabase with the service key. No key (a fork, or before setup): skip.
          rpc() {
            if [[ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then echo "::notice::SUPABASE_SERVICE_ROLE_KEY is not set, so $1 is skipped."; return 0; fi
            local out code
            out=$(mktemp)
            code=$({
              printf 'header = "apikey: %s"\n' "$SUPABASE_SERVICE_ROLE_KEY"
              [[ "$SUPABASE_SERVICE_ROLE_KEY" == sb_secret_* ]] || printf 'header = "Authorization: Bearer %s"\n' "$SUPABASE_SERVICE_ROLE_KEY"
            } | curl -sS --config - --max-time 30 --retry 2 -o "$out" -w '%{http_code}' -X POST \
                  -H 'Content-Type: application/json' --data "$2" "$SUPABASE_URL/rest/v1/rpc/$1") || { echo "::error::could not reach Supabase ($1)"; return 1; }
            cat "$out"; echo
            [[ "$code" == 2* ]] || { echo "::error::Supabase $1 answered HTTP $code"; return 1; }
          }
          claim_call() {  # claim_call record_claim|release_claim <issue number> <github id> <login>
            [[ "$2" =~ ^[0-9]+$ && "$3" =~ ^[0-9]+$ ]] || { echo "::error::unexpected issue or user id"; return 1; }
            if [[ "$1" == record_claim ]]; then
              rpc record_claim "$(jq -nc --arg repo "$GH_REPO" --argjson issue "$2" --argjson id "$3" --arg login "$4" \
                '{p_repo:$repo, p_issue:$issue, p_github_id:$id, p_github_login:$login}')"
            else
              rpc release_claim "$(jq -nc --arg repo "$GH_REPO" --argjson issue "$2" --argjson id "$3" \
                '{p_repo:$repo, p_issue:$issue, p_github_id:$id}')"
            fi
          }
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          # An open pull request that says "Closes #n" keeps the claim: it is waiting on us, not on them.
          linked=" $(gh pr list --state open --limit 200 --json closingIssuesReferences \
            --jq '[.[].closingIssuesReferences[].number] | join(" ")') "
          rows=$(gh issue list --label taken --state open --limit 200 --json number,updatedAt,assignees \
            --jq ".[] | select(.updatedAt < \"$cutoff\") | \"\(.number) \([.assignees[].login] | join(\",\"))\"")
          failed=0
          while read -r number people; do
            [[ -n "$number" ]] || continue
            [[ "$linked" == *" $number "* ]] && continue
            # The claim is released for each person who held the issue; the numeric ids come from the REST API.
            ids=$(gh api "repos/$GH_REPO/issues/$number" --jq '[.assignees[].id] | join(" ")' </dev/null)
            gh issue comment "$number" --body "No activity for 14 days, so this is free again for anyone to \`/take\`. Thanks for looking at it!" </dev/null
            args=(--remove-label taken)
            [[ -n "$people" ]] && args+=(--remove-assignee "$people")
            gh issue edit "$number" "${args[@]}" </dev/null
            for id in $ids; do claim_call release_claim "$number" "$id" "" || failed=1; done
          done <<< "$rows"
          exit "$failed"
