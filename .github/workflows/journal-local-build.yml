name: Journal local app builds

on:
  pull_request:
    branches: [main]
    paths:
      - 'lightning/runtime/journal*.py'
      - 'lightning/sync/journal/**'
      - 'android/**'
      - '.github/workflows/journal-local-build.yml'

permissions:
  contents: read

concurrency:
  group: journal-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13'}
      - name: Install the locked build environment
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/build-tools.lock
          python -m pip install --require-hashes --only-binary=:all: --no-binary=proxy-tools --no-build-isolation -r requirements/desktop-probe-win.lock
      - run: python -m tools.market release
      - run: pyinstaller --clean --noconfirm packaging/desktop-app.spec
      - run: python packaging/package_app.py --strict
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: journal-windows-review-build
          path: |
            dist/Lightning-v*-Windows-x64.zip
            dist/APP_SHA256SUMS
            dist/BUILD_INFO.txt
          retention-days: 7

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13'}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with: {packages: platform-tools}
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with: {gradle-version: '8.11.1'}
      - name: Development build identity
        id: identity
        run: python packaging/phone_build.py identity
      - name: Build the phone app from locked inputs
        working-directory: android
        env:
          CODE: ${{ steps.identity.outputs.version_code }}
          NAME: ${{ steps.identity.outputs.version_name }}
        run: gradle --no-daemon :app:assembleDebug "-PtestVersionCode=$CODE" "-PtestVersionName=$NAME"
      - name: Verify the built APK
        env:
          CODE: ${{ steps.identity.outputs.version_code }}
          NAME: ${{ steps.identity.outputs.version_name }}
        run: >-
          python packaging/phone_build.py check android/app/build/outputs/apk/debug/app-debug.apk
          --build-tools "$ANDROID_HOME/build-tools/35.0.0" --code "$CODE" --name "$NAME"
          --info android/app/build/outputs/apk/debug/build-info.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: journal-android-review-build
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/build-info.json
          retention-days: 7
