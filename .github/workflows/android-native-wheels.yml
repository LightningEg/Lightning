# The arm64 wheels the phone app needs that no index has (cryptography, sqlcipher3, cffi, pydantic_core).
# No wheel from this job is used in a Google Play release until its source, link dependencies, Android
# runtime and 16 KB support are verified.
#
# Run by hand with no input to build the four wheels as artifacts (they expire). Run again with publish_run
# set to that run's id to publish them, unchanged, as the prerelease android-wheels-r<run> of this
# repository, which never expires; then regenerate requirements/android.lock with tools/android_lock.py.
# How it fits: docs/ARCHITECTURE.md › Build and release.
name: Android native wheel experiment

on:
  workflow_dispatch:
    inputs:
      publish_run:
        description: Publish the wheels of this earlier successful run (its id) as a permanent release
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    if: inputs.publish_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: cryptography
            version: 50.0.2
          - package: sqlcipher3
            version: 0.6.2
          # cryptography 50 needs cffi >= 2.0 at run time; Chaquopy's index stops at 1.17.1.
          - package: cffi
            version: 2.0.0
          # fastapi needs pydantic; the shipped app's lock pins pydantic-core 2.46.5 (Rust, no C libraries).
          - package: pydantic_core
            version: 2.46.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4
        with:
          packages: platform-tools
      - name: Install pinned wheel builder
        run: python -m pip install 'cibuildwheel==4.2.1'
      - name: Download pinned source distribution
        env:
          PROBE_PACKAGE: ${{ matrix.package }}
          PROBE_VERSION: ${{ matrix.version }}
        run: |
          mkdir -p /tmp/lightning-android-source
          python -m pip download --no-deps --no-binary=:all: \
            --dest /tmp/lightning-android-source "${PROBE_PACKAGE}==${PROBE_VERSION}"
          tar -xzf /tmp/lightning-android-source/*.tar.gz -C /tmp/lightning-android-source
      - name: Give SQLCipher's Conan explicit Android host and Linux build profiles
        if: matrix.package == 'sqlcipher3'
        env:
          PROBE_VERSION: ${{ matrix.version }}
        run: |
          # The upstream setup.py passes only os/arch, and Conan then guesses an Android *build* machine with no
          # compiler. Two explicit profiles: OpenSSL cross-built by the NDK's Clang, Conan itself run on Linux.
          test -d "${ANDROID_NDK_LATEST_HOME}"
          cat > /tmp/lightning-conan-android <<PROFILE
          [settings]
          os=Android
          os.api_level=24
          arch=armv8
          compiler=clang
          compiler.version=18
          compiler.libcxx=c++_static
          build_type=Release
          [conf]
          tools.android:ndk_path=${ANDROID_NDK_LATEST_HOME}
          tools.build:exelinkflags=["-Wl,-z,max-page-size=16384"]
          tools.build:sharedlinkflags=["-Wl,-z,max-page-size=16384"]
          PROFILE
          cat > /tmp/lightning-conan-linux <<'PROFILE'
          [settings]
          os=Linux
          arch=x86_64
          compiler=gcc
          compiler.version=13
          compiler.libcxx=libstdc++11
          build_type=Release
          PROFILE
          cat /tmp/lightning-conan-android
          python - <<'PY'
          import os
          from pathlib import Path
          source = Path('/tmp/lightning-android-source') / f"sqlcipher3-{os.environ['PROBE_VERSION']}" / 'setup.py'
          original = source.read_text(encoding='iso-8859-1')
          needle = "        *[x for s in settings for x in ('-s', s)],"
          assert original.count(needle) == 1, 'upstream setup changed; review the Conan patch'
          patched = original.replace(needle, "        '-pr:h', '/tmp/lightning-conan-android', '-pr:b', '/tmp/lightning-conan-linux',")
          # SQLCipher logs through Android's liblog (__android_log_write), which upstream does not link.
          link = "        extra_link_args.extend(['-lm', '-lcrypto'])"
          assert patched.count(link) == 1, 'upstream link arguments changed; review the patch'
          patched = patched.replace(link, "        extra_link_args.extend(['-lm', '-lcrypto', '-llog'])")
          source.write_text(patched, encoding='iso-8859-1')
          PY
      - name: Build a static OpenSSL for Android (cryptography links it)
        if: matrix.package == 'cryptography'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/openssl.tar.gz https://github.com/openssl/openssl/releases/download/openssl-3.5.4/openssl-3.5.4.tar.gz
          echo "967311f84955316969bdb1d8d4b983718ef42338639c621ec4c34fddef355e99  /tmp/openssl.tar.gz" | sha256sum -c -
          tar -xzf /tmp/openssl.tar.gz -C /tmp
          cd /tmp/openssl-3.5.4
          export ANDROID_NDK_ROOT="${ANDROID_NDK_LATEST_HOME}"
          export PATH="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin:${PATH}"
          ./Configure android-arm64 -D__ANDROID_API__=24 no-shared no-tests no-docs \
            -Wl,-z,max-page-size=16384 --prefix=/tmp/openssl-android --libdir=lib
          make -j"$(nproc)" >/dev/null
          make install_sw >/dev/null
          ls /tmp/openssl-android/lib /tmp/openssl-android/include/openssl | head -5
      - name: Build a static libffi for Android (cffi links it)
        if: matrix.package == 'cffi'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/libffi.tar.gz https://github.com/libffi/libffi/releases/download/v3.5.2/libffi-3.5.2.tar.gz
          echo "f3a3082a23b37c293a4fcd1053147b371f2ff91fa7ea1b2a52e335676bac82dc  /tmp/libffi.tar.gz" | sha256sum -c -
          tar -xzf /tmp/libffi.tar.gz -C /tmp
          cd /tmp/libffi-3.5.2
          bin="${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ./configure --host=aarch64-linux-android --prefix=/tmp/libffi-android --disable-shared --enable-static \
            --with-pic --disable-docs CC="$bin/aarch64-linux-android24-clang" AR="$bin/llvm-ar" RANLIB="$bin/llvm-ranlib" >/dev/null
          make -j"$(nproc)" >/dev/null
          make install >/dev/null
          ls /tmp/libffi-android/include /tmp/libffi-android/lib/pkgconfig
      - name: Install isolated target-header locator
        run: cp android/find_target_python_include.py /tmp/lightning-find-target-python-include.py
      - name: Cross-build CPython 3.13 arm64 wheel
        env:
          CIBW_BUILD: 'cp313-*'
          CIBW_ARCHS_ANDROID: arm64_v8a
          CIBW_TEST_SKIP: '*'
          # cibuildwheel rewrites CFLAGS after this, but the Rust cc crate reads the target-specific
          # variable first, so the full target flags (Python.h folder, Android OpenSSL) go there. Android
          # resolves no Python symbol for a module that does not link libpython (cryptography's abi3 _rust.so).
          CIBW_ENVIRONMENT_ANDROID: >-
            CFLAGS_aarch64_linux_android="-D__BIONIC_NO_PAGE_SIZE_MACRO -I$(python /tmp/lightning-find-target-python-include.py) -I/tmp/openssl-android/include -DNDEBUG -O3"
            AARCH64_LINUX_ANDROID_OPENSSL_DIR=/tmp/openssl-android
            OPENSSL_DIR=/tmp/openssl-android
            OPENSSL_STATIC=1
            CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-C link-arg=-L$(python /tmp/lightning-find-target-python-include.py lib) -C link-arg=-lpython3.13 -C link-arg=-Wl,-z,max-page-size=16384"
            PKG_CONFIG_PATH=/tmp/libffi-android/lib/pkgconfig
          ANDROID_API_LEVEL: '24'
          PROBE_PACKAGE: ${{ matrix.package }}
          PROBE_VERSION: ${{ matrix.version }}
        run: >-
          python -m cibuildwheel --platform android --archs arm64_v8a
          --output-dir /tmp/lightning-android-wheels
          "/tmp/lightning-android-source/${PROBE_PACKAGE}-${PROBE_VERSION}"
      - name: Check every native module links libpython (and report 16 KB pages)
        run: |
          set -euo pipefail
          readelf="${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          mkdir -p /tmp/wheel-check && cd /tmp/wheel-check
          for wheel in /tmp/lightning-android-wheels/*.whl; do python -m zipfile -e "$wheel" .; done
          status=0
          while IFS= read -r so; do
            # Android resolves Python symbols only through a declared libpython dependency.
            if "$readelf" --dyn-syms "$so" | grep -q ' UND .*Py' && ! "$readelf" -d "$so" | grep -q 'libpython3.13.so'; then
              echo "::error::$so uses Python symbols but does not link libpython3.13.so"; status=1
            fi
            if "$readelf" -l "$so" | awk '$1=="LOAD" && $NF!="0x4000"{bad=1} END{exit !bad}'; then
              echo "::warning::$so has a LOAD segment not aligned to 16 KB (needed for Google Play, not for this probe)"
            fi
          done < <(find . -name '*.so')
          exit $status
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: success()
        with:
          name: android-${{ matrix.package }}-wheel
          path: /tmp/lightning-android-wheels/*.whl

  publish:
    name: Publish an earlier run's wheels as a release
    if: inputs.publish_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # to create the release
      actions: read    # to read the earlier run and its artifacts
    steps:
      - name: The run is a successful run of this workflow on main
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.publish_run }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}" \
            --jq '[.path, .head_branch, .conclusion, .head_sha, .html_url] | @tsv' > run.tsv
          IFS=$'\t' read -r path branch conclusion sha url < run.tsv
          [ "$path" = ".github/workflows/android-native-wheels.yml" ] || { echo "::error::run $RUN is not this workflow ($path)"; exit 1; }
          [ "$branch" = "main" ] && [ "$conclusion" = "success" ] || { echo "::error::run $RUN is $conclusion on $branch, not success on main"; exit 1; }
          if gh release view "android-wheels-r${RUN}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::android-wheels-r${RUN} already exists; a published wheel set is never replaced"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          run-id: ${{ inputs.publish_run }}
          github-token: ${{ github.token }}
          pattern: android-*-wheel
          merge-multiple: true
          path: wheels
      - name: Exactly the four wheels, for CPython 3.13 on arm64 Android
        working-directory: wheels
        run: |
          set -euo pipefail
          ls -l
          for name in cryptography sqlcipher3 cffi pydantic_core; do
            count=$(ls ${name}-*-android_24_arm64_v8a.whl 2>/dev/null | wc -l)
            [ "$count" = 1 ] || { echo "::error::expected one ${name} arm64 wheel, found $count"; exit 1; }
          done
          [ "$(ls | wc -l)" = 4 ] || { echo "::error::expected exactly four files"; exit 1; }
      - name: Checksums and provenance
        working-directory: wheels
        env:
          RUN: ${{ inputs.publish_run }}
          SHA: ${{ steps.source.outputs.sha }}
          URL: ${{ steps.source.outputs.url }}
        run: |
          set -euo pipefail
          sha256sum *.whl > SHA256SUMS
          {
            echo "Built by run $RUN of .github/workflows/android-native-wheels.yml: $URL"
            echo "Source commit (the build recipe): $SHA"
            echo "Published unchanged by run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT"
            echo "Each wheel's source is its PyPI source distribution of the version in its name;"
            echo "OpenSSL 3.5.4 and libffi 3.5.2 are checked by SHA-256 in that recipe."
          } > PROVENANCE.txt
          cat SHA256SUMS PROVENANCE.txt
          { echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish android-wheels-r${{ inputs.publish_run }}
        working-directory: wheels
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.publish_run }}
        # The tag goes on this run's commit: the job token may not tag an older commit whose workflow files
        # differ from main's (HTTP 403). PROVENANCE.txt names the commit the wheels were built from.
        run: >-
          gh release create "android-wheels-r${RUN}" -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA"
          --title "Android build input: native wheels of run ${RUN} (not an app release)"
          --notes "The arm64 wheels the phone app is built with, pinned by SHA-256 in requirements/android.lock. Not an app; nothing here is installed by people."
          *.whl SHA256SUMS PROVENANCE.txt
