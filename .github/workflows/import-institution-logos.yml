name: Import Egyptian institution logos
on:
  push:
    branches: [codex/institution-logo-catalog]
    paths:
      - tools/import_egypt_wallet_logos.py
      - .github/workflows/import-institution-logos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install image processing dependencies
        run: python -m pip install 'Pillow>=10,<13' 'requests>=2.31,<3' 'CairoSVG>=2.7,<3'
      - name: Import and verify logos
        run: python tools/import_egypt_wallet_logos.py
      - name: Commit asset images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/institutions-logos/ lightning/ui/static/institutions/ lightning/accounts/institutions.csv
          if ! git diff --cached --quiet; then
            git commit -m 'assets: import authentic Egyptian institution logo images'
            git push
          fi
