# Checks every pull request, including ones from forks. Fork PRs get a read-only token and no secrets, and this
# file never uses pull_request_target, so untrusted code never runs with write access or secrets.
name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  minimum-python:
    # Pure contracts need no native wheels or dependency lock. Full integration stays on 3.13 below.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      - name: Compile supported application and tool syntax
        run: python -m compileall -q lightning tools tests/runtime_contracts
      - name: Pure financial contracts without third-party dependencies
        run: python -m unittest discover -s tests/runtime_contracts -v

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/desktop-probe-linux.lock -r requirements/browser.lock
      - name: Install Chromium for the browser tests (IT-1U)
        # The browser tests (clicks, phone layout, the brand audit) skipped on every pull request until this step, and
        # failures piled up unseen. The link puts this Chromium on the PATH for tests that look for `chromium` there.
        run: |
          python -m playwright install --with-deps chromium
          sudo ln -sf "$(python -c 'from playwright.sync_api import sync_playwright as s; p = s().start(); print(p.chromium.executable_path); p.stop()')" /usr/local/bin/chromium
      - env:
          LIGHTNING_REQUIRE_BROWSER: '1'  # a browser test that skips for want of a browser fails (tests/browser_support.py)
        run: |
          python -m pytest -o addopts= -o faulthandler_timeout=120 -q -n auto --dist loadfile
      - run: lint-imports
      - name: Unused imports and variables (ruff, IT-1J)
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements/lint.lock
          ruff check lightning tools

  release-notes:
    # A pull request from this repository ends with Release-note and Detail trailers (AGENTS.md section 3). The squash
    # keeps every commit's trailers, so they reach main. A fork's contributor is not asked: the maintainer writes them at merge.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - run: python tools/release_notes.py check-pr "origin/${{ github.base_ref }}"

  protected-paths:
    # Tells the owner at a glance when a PR touches build, release or CI files; the owner still decides.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: List sensitive files changed
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep -E '^(\.github/|packaging/|android/|cloudflare/|tools/|AGENTS\.md|CLAUDE\.md|LICENSE|SECURITY\.md)' \
            | sed 's/^/::warning::sensitive file changed: /' || true

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with: {fail-on-severity: high}

  journal-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts && npm test && npm audit --audit-level=high
        working-directory: cloudflare/journal
