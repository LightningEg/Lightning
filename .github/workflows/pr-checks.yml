# Checks every pull request, including ones from forks. Fork PRs get a read-only token and no secrets, and this
# file never uses pull_request_target, so untrusted code never runs with write access or secrets.
name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/desktop-probe-linux.lock
      - run: |
          python -m pytest -o addopts= -o faulthandler_timeout=120 -q -n auto --dist loadfile
      - run: lint-imports

  protected-paths:
    # Tells the owner at a glance when a PR touches build, release or CI files; the owner still decides.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with: {fetch-depth: 0, persist-credentials: false}
      - name: List sensitive files changed
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep -E '^(\.github/|packaging/|android/|cloudflare/|tools/|AGENTS\.md|CLAUDE\.md|LICENSE|SECURITY\.md)' \
            | sed 's/^/::warning::sensitive file changed: /' || true

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with: {persist-credentials: false}
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4.9.0
        with: {fail-on-severity: high}
