# Checks every pull request, including ones from forks. Fork PRs get a read-only token and no secrets, and this
# file never uses pull_request_target, so untrusted code never runs with write access or secrets.
name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/desktop-probe-linux.lock
      - run: |
          python -m pytest -o addopts= -o faulthandler_timeout=120 -q -n auto --dist loadfile
      - run: lint-imports

  protected-paths:
    # Tells the owner at a glance when a PR touches build, release or CI files; the owner still decides.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: List sensitive files changed
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep -E '^(\.github/|packaging/|android/|cloudflare/|tools/|AGENTS\.md|CLAUDE\.md|LICENSE|SECURITY\.md)' \
            | sed 's/^/::warning::sensitive file changed: /' || true

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with: {fail-on-severity: high}

  journal-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts && npm test && npm audit --audit-level=high
        working-directory: cloudflare/journal
