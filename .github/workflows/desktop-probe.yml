# Lightning for Windows and the matched phone test build: test every push, build the app, and publish
# tagged releases.
#
# - Every push to main runs the full test suite on Linux, and nothing else (owner, 2026-10-06: Actions
#   minutes are limited and Windows minutes count double). A push that changes only documents since the
#   last full suite runs the tests that read them (packaging/ci_scope.py). Tests run one worker per core.
# - The Windows app is built after that suite passes, on a tag, on a manual run, and once a day when
#   something that can change the app changed since the last successful Windows build.
# - The ZIP that is uploaded is the ZIP that was tested: it is extracted to a fresh folder and its
#   own Lightning.exe must pass the self-check and the real WebView2 window check.
# - A tag vX.Y.Z[-beta.N] that matches the source version and sits on main publishes the tested ZIP
#   and matching signed APK as a new, never-replaced release in elfekimuhammed/Lightning-downloads.
#   How to release: docs/ARCHITECTURE.md › Desktop app and encrypted profiles › Build and release.
# - The daily run also builds and checks the phone app (no key, nothing offered) when its files changed.
# - A manual run on main makes the matched test builds: the Windows ZIP and the phone APK (Lightning Test)
#   of one commit, as two seven-day downloads, offered only when both pass every check. It reuses a
#   Windows ZIP an earlier run built and tested for this commit, and skips a Linux suite that already
#   passed on it (packaging/ci_scope.py). It needs the test key: docs/ARCHITECTURE.md › Build and release.
name: PC and phone app

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 1 * * *'  # daily, about 04:17 in Cairo: builds Windows only if the app changed

permissions:
  contents: read

concurrency:
  # A newer push to main replaces an older push run; a release tag is never cancelled. Daily and manual
  # runs have groups of their own, so a push never cancels the daily Windows build or the test builds.
  group: windows-app-${{ github.ref }}${{ github.event_name != 'push' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHONUTF8: '1'
  DOWNLOADS_REPO: elfekimuhammed/Lightning-downloads

jobs:
  tests:
    name: Full test suite (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read  # to find the last commit whose Windows build succeeded, and what this commit has
    outputs:
      build_windows: ${{ steps.scope.outputs.build_windows }}
      phone: ${{ steps.scope.outputs.phone }}
      phone_daily: ${{ steps.scope.outputs.phone_daily }}
      reuse_run: ${{ steps.scope.outputs.reuse_run }}
      reuse_artifact: ${{ steps.scope.outputs.reuse_artifact }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0  # the docs-only check and the release-tag check read history
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'
      - name: Decide whether the Windows app must be built
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          # Only whether the secrets exist, never their values: a manual run says at once what it can make.
          HAS_TEST_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        run: python packaging/ci_scope.py
      - name: Check the release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python packaging/ci_scope.py --check-release-tag
      - name: Install locked Linux dependencies
        if: steps.scope.outputs.suite != 'skip'
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/desktop-probe-linux.lock
      - name: Full test suite
        if: steps.scope.outputs.suite == 'run'
        # One worker per core, each test file on one worker (Mohab's year is built once, not per worker).
        run: python -m pytest -o addopts= -o faulthandler_timeout=120 -q -n auto --dist loadfile
      - name: Documentation tests (only documents changed since the last full suite)
        if: steps.scope.outputs.suite == 'docs'
        env:
          DOCS_TESTS: ${{ steps.scope.outputs.docs_tests }}
        run: python -m pytest -o addopts= -o faulthandler_timeout=120 -q $DOCS_TESTS
      - name: Check import contracts
        if: steps.scope.outputs.suite == 'run'
        run: lint-imports

  windows:
    name: Build and test the Windows app
    needs: tests
    if: needs.tests.outputs.build_windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 40
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}
      zip: ${{ steps.package.outputs.zip }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/build-tools.lock
          python -m pip install --require-hashes --only-binary=:all: --no-binary=proxy-tools --no-build-isolation -r requirements/desktop-probe-win.lock
      - name: Test Windows profiles, encrypted storage, desktop and UI
        timeout-minutes: 20
        run: >-
          python -m pytest -o addopts= -o faulthandler_timeout=120 -q -n auto --dist loadfile
          tests/test_desktop_crypto.py tests/test_desktop_window.py
          tests/test_desktop_packaging.py tests/test_profile_packaging.py
          tests/test_profile_app.py tests/test_profile_session.py
          tests/test_runtime_paths.py tests/test_runtime_instance.py
          tests/test_encrypted_database.py tests/test_database_staging.py
          tests/test_database_promotion.py tests/test_database_promotion_windows.py
          tests/test_migration_safety.py tests/test_database.py tests/test_device_roundtrip.py
          tests/test_sync_control.py tests/test_sync_lend.py tests/test_sync_transport.py tests/test_devices_app.py
          tests/test_figures.py tests/test_ui.py
      - name: Price files the app carries (market.zip; required for a tagged release)
        run: python -m tools.market release ${{ github.ref_type == 'tag' && '--required' || '' }}
      - name: Build the one-folder app
        run: pyinstaller --clean --noconfirm packaging/desktop-app.spec
      - name: Package the app
        id: package
        shell: pwsh
        run: python packaging/package_app.py --strict
      - name: Extract the packaged ZIP to a fresh folder
        id: shipped
        shell: pwsh
        run: |
          $zip = "dist/${{ steps.package.outputs.zip }}"
          $expected = ((Get-Content -LiteralPath dist/APP_SHA256SUMS -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Checksum mismatch: $actual (ZIP) vs $expected (APP_SHA256SUMS)" }
          $target = Join-Path $env:RUNNER_TEMP 'shipped'
          if (Test-Path $target) { Remove-Item -Recurse -Force $target }
          Expand-Archive -LiteralPath $zip -DestinationPath $target
          # Users download the ZIP in a browser and extract it in Explorer, which marks every file as
          # coming from the internet. Mark the copy under test the same way, so the checks below run
          # what users run (.NET is stricter about loading marked DLLs, e.g. for pythonnet).
          $marked = 0
          Get-ChildItem -LiteralPath $target -Recurse -File | ForEach-Object {
            Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
            $marked++
          }
          Write-Host "Marked $marked extracted files as downloaded from the internet (ZoneId=3)."
          $exe = Join-Path $target 'Lightning/Lightning.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "The ZIP has no Lightning/Lightning.exe" }
          foreach ($file in 'README.txt', 'BUILD_INFO.txt', 'Lightning.exe.config', 'licenses/dependency-versions.txt') {
            if (-not (Test-Path -LiteralPath (Join-Path $target "Lightning/$file"))) { throw "The ZIP has no Lightning/$file" }
          }
          "exe=$exe" >> $env:GITHUB_OUTPUT
      - name: Shipped app self-check (encrypted profile, finance pages)
        shell: pwsh
        run: ./packaging/run_check.ps1 -Exe '${{ steps.shipped.outputs.exe }}' -Report reports/app-self-check.json -Arguments '--self-check'
      - name: Shipped app window check (profile chooser in WebView2)
        shell: pwsh
        run: ./packaging/run_check.ps1 -Exe '${{ steps.shipped.outputs.exe }}' -Report reports/app-window.json -Arguments '--smoke' -TimeoutSeconds 120
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            dist/Lightning-v*-Windows-x64.zip
            dist/APP_SHA256SUMS
            dist/BUILD_INFO.txt
          if-no-files-found: error
          overwrite: true  # a re-run of a tag build replaces its own earlier upload
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 7 }}
      - name: Keep the check reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: windows-check-reports-r${{ github.run_number }}-a${{ github.run_attempt }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  phone:
    # The matched test builds (manual or release tag), or the daily check when the phone's files changed: that one
    # builds and checks the phone, needs no key and offers nothing.
    name: Phone app
    needs: tests
    if: needs.tests.outputs.phone == 'true' || needs.tests.outputs.phone_daily == 'true'
    uses: ./.github/workflows/android-app.yml
    with:
      bundle: ${{ needs.tests.outputs.phone == 'true' }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  bundle:
    name: Matched test builds
    needs: [tests, windows, phone]
    # Only when the phone app passed and the Windows ZIP of this commit was built and tested in this run
    # or an earlier one; anything else offers nothing.
    if: >-
      always() && github.event_name == 'workflow_dispatch' && needs.tests.result == 'success' && needs.tests.outputs.phone == 'true'
      && needs.phone.result == 'success'
      && (needs.windows.result == 'success' || (needs.windows.result == 'skipped' && needs.tests.outputs.reuse_run != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read  # to download a reused Windows ZIP from the earlier run
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        if: needs.tests.outputs.reuse_run == ''
        with:
          name: ${{ needs.windows.outputs.artifact }}
          path: windows
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        if: needs.tests.outputs.reuse_run != ''
        with:
          run-id: ${{ needs.tests.outputs.reuse_run }}
          github-token: ${{ github.token }}
          name: ${{ needs.tests.outputs.reuse_artifact }}
          path: windows
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: phone-apk
          path: phone
      - name: The pair is one commit, and each file is the one that was checked
        id: bundle
        env:
          REUSED: ${{ needs.tests.outputs.reuse_run }}
        run: >-
          python packaging/phone_build.py bundle --windows windows --apk phone/Lightning-Test-*.apk
          --info phone/apk.json --out bundle --reused-from "$REUSED"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: ${{ steps.bundle.outputs.pc }}
          path: bundle/PC/
          if-no-files-found: error
          overwrite: true  # a re-run replaces its own downloads
          retention-days: 7
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: ${{ steps.bundle.outputs.phone }}
          path: bundle/Phone/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Say what to download
        env:
          PC: ${{ steps.bundle.outputs.pc }}
          PHONE: ${{ steps.bundle.outputs.phone }}
        run: |
          {
            echo "### Matched test builds of ${GITHUB_SHA:0:8}"
            echo "- PC: download **$PC**, extract it, run Lightning\\Lightning.exe."
            echo "- Phone: download **$PHONE** on the phone and install the APK inside (Lightning Test)."
            echo "Sample or real data; keep an independent backup. Each holds README.txt, SHA256SUMS and BUILD.json."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish the release
    environment: production-release
    needs: [tests, windows, phone]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: ${{ needs.windows.outputs.artifact }}
          path: release
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: phone-apk
          path: phone
      - name: Verify that the Windows ZIP and signed APK are the tested pair from this commit
        run: |
          python packaging/phone_build.py bundle --windows release --apk phone/Lightning-Test-*.apk \
            --info phone/apk.json --out verified
          cp verified/PC/SHA256SUMS verified/PC/BUILD.json release/
          cp phone/Lightning-Test-*.apk release/
      - name: Publish to Lightning-downloads
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.LIGHTNING_DOWNLOADS_TOKEN }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ needs.windows.outputs.zip }}
        run: |
          export APK="$(jq -r .android.file BUILD.json)"
          bash "$GITHUB_WORKSPACE/packaging/publish_release.sh"
